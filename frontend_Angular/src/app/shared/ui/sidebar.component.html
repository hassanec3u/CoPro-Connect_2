<aside class="sidebar" [class.sidebar-open]="isOpen">
  <div class="sidebar-header">
    <h2>Pontet Admin</h2>
    <button class="sidebar-close-btn" (click)="close.emit()" aria-label="Fermer le menu">✖</button>
  </div>

  <div class="sidebar-user" *ngIf="currentUser">
    <div class="avatar">{{ (currentUser.name || currentUser.username).charAt(0).toUpperCase() }}</div>
    <div class="user-meta">
      <div class="user-name">{{ currentUser.name || currentUser.username }}</div>
      <div class="user-role" [class.admin]="(currentUser.role || '').toUpperCase() === 'ADMIN'">
        {{ currentUser.role || 'USER' }}
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul>
      <li *ngFor="let item of menuItems">
        <button
          class="nav-btn"
          [class.active]="currentPath === item.path"
          (click)="handleNavigate(item.path)"
        >
          {{ item.label }}
        </button>
      </li>
    </ul>
  </nav>
  <div class="sidebar-footer">
    <button class="sidebar-logout-btn" (click)="logout.emit()">🚪 Déconnexion</button>
  </div>
</aside>
