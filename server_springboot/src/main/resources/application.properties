# ==========================================
# CoPro Connect - Configuration Spring Boot
# ==========================================

# Server Configuration
server.port=${SERVER_PORT:4000}
server.servlet.context-path=/

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/copro-connect}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-secret-change-me-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# Mail Configuration (MFA)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# MFA Configuration
mfa.code.length=6
mfa.code.expiration-minutes=5
mfa.sender.email=${MFA_SENDER_EMAIL:noreply@copro-connect.fr}
mfa.sender.name=CoPro Connect

# Logging
logging.level.root=INFO
logging.level.com.copro=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/copro-connect.log

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}

# Error Handling
server.error.include-message=always
server.error.include-stacktrace=on_param

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
